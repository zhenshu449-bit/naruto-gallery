<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🍃 Naruto Gallery</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#101010;
  color:#fff;
  font-family:Arial,"Microsoft YaHei",sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#181818;
  padding:12px;
  border-bottom:1px solid #333;
}

h1{
  margin:0 0 10px;
  font-size:22px;
}

input{
  width:100%;
  padding:11px;
  margin-bottom:8px;
  border:0;
  border-radius:8px;
  background:#292929;
  color:#fff;
  outline:none;
  font-size:15px;
}

button{
  padding:9px 12px;
  margin:3px 2px;
  border:0;
  border-radius:8px;
  background:#303030;
  color:#fff;
  font-size:14px;
}

button.active{
  background:#e67e22;
}

#status{
  margin-top:7px;
  color:#aaa;
  font-size:13px;
}

#gallery{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  padding:10px;
}

.card{
  overflow:hidden;
  background:#1d1d1d;
  border-radius:10px;
}

.card img{
  display:block;
  width:100%;
  height:auto;
  background:#222;
  cursor:pointer;
}

.info{
  padding:9px;
  font-size:13px;
}

.actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.actions button{
  flex:1;
  margin:0;
}

.load{
  display:block;
  margin:15px auto 30px;
  background:#e67e22;
  font-size:16px;
}

.empty{
  text-align:center;
  color:#888;
  padding:60px 10px;
  font-size:16px;
}

/* 查看器 */

#viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  touch-action:none;
}

#viewerImg{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
  transform-origin:center;
}

#close{
  position:fixed;
  top:12px;
  right:12px;
  z-index:101;
  width:44px;
  height:44px;
  padding:0;
  margin:0;
  border-radius:50%;
  background:#333;
  font-size:28px;
}

#hint{
  position:fixed;
  bottom:15px;
  left:0;
  right:0;
  text-align:center;
  color:#aaa;
  font-size:13px;
  pointer-events:none;
}
</style>
</head>

<body>

<header>

<h1>🍃 Naruto Gallery</h1>

<input
  id="search"
  placeholder="输入角色或标签，例如 haruno_sakura">

<div>

<button class="active"
onclick="character('haruno_sakura',this)">
春野樱
</button>

<button
onclick="character('hyuuga_hinata',this)">
日向雏田
</button>

<button
onclick="character('yamanaka_ino',this)">
井野
</button>

<button
onclick="character('tsunade',this)">
纲手
</button>

<button
onclick="character('tenten',this)">
天天
</button>

<button
onclick="character('temari',this)">
手鞠
</button>

<button
onclick="character('terumi_mei',this)">
照美冥
</button>

</div>

<div>

<button
onclick="setMode('all',this)">
全部
</button>

<button
onclick="setMode('sfw',this)">
SFW
</button>

<button
onclick="setMode('nsfw',this)">
NSFW
</button>

<button
onclick="setMode('fav',this)">
❤️ 收藏
</button>

<button
onclick="setMode('blocked',this)">
🚫 已拉黑
</button>

</div>

<div id="status">
正在加载……
</div>

</header>

<main id="gallery"></main>

<button
id="loadButton"
class="load"
onclick="loadMore()">
加载更多
</button>


<div id="viewer">

<button id="close">
×
</button>

<img id="viewerImg">

<div id="hint">
双击放大 · 双指缩放 · 单指拖动
</div>

</div>


<script>

/* =====================================
   基本设置
===================================== */

const API =
"https://danbooru.donmai.us/posts.json";

const LIMIT = 100;

let currentTag =
"haruno_sakura";

let page = 1;

let mode = "all";

let loading = false;


/* =====================================
   DOM
===================================== */

const gallery =
document.getElementById("gallery");

const status =
document.getElementById("status");

const search =
document.getElementById("search");

const loadButton =
document.getElementById("loadButton");


/* =====================================
   本地数据
===================================== */

function readStorage(key){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(key) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch(e){

    return [];

  }

}


function normalizeItem(item){

  if(typeof item === "string"){

    return {
      id:String(item),
      image:"",
      preview:"",
      rating:"q"
    };

  }

  if(!item || !item.id){

    return null;

  }

  return {
    id:String(item.id),
    image:item.image || "",
    preview:item.preview || "",
    rating:item.rating || "q"
  };

}


let favorites =
readStorage("narutoFavorites")
.map(normalizeItem)
.filter(Boolean);


let blocked =
readStorage("narutoBlocked")
.map(normalizeItem)
.filter(Boolean);


/* =====================================
   保存
===================================== */

function saveFavorites(){

  localStorage.setItem(
    "narutoFavorites",
    JSON.stringify(favorites)
  );

}


function saveBlocked(){

  localStorage.setItem(
    "narutoBlocked",
    JSON.stringify(blocked)
  );

}


/* =====================================
   判断
===================================== */

function isFavorite(id){

  return favorites.some(
    x => String(x.id) === String(id)
  );

}


function isBlocked(id){

  return blocked.some(
    x => String(x.id) === String(id)
  );

}


function isSFW(post){

  return (
    post.rating === "s" ||
    post.rating === "g"
  );

}


/*
  鸣人 / 佐助排除

  注意：
  不放进 API 查询参数，
  避免导致 API 返回异常。

  在前端过滤。
*/

function isExcluded(post){

  const tags =
    String(post.tag_string || "")
    .toLowerCase();

  const forbidden = [

    "naruto_uzumaki",

    "uzumaki_naruto",

    "sasuke_uchiha",

    "uchiha_sasuke"

  ];

  return forbidden.some(
    tag =>
      tags
      .split(/\s+/)
      .includes(tag)
  );

}


/* =====================================
   获取标签
===================================== */

function getTags(){

  const text =
    search.value.trim();

  return text || currentTag;

}


/* =====================================
   角色按钮
===================================== */

function character(tag,btn){

  currentTag =
    tag;

  page =
    1;

  mode =
    "all";

  gallery.innerHTML =
    "";

  document
    .querySelectorAll("header button")
    .forEach(
      b =>
        b.classList.remove("active")
    );

  btn.classList.add("active");

  loadButton.style.display =
    "block";

  loadMore();

}


/* =====================================
   模式按钮
===================================== */

function setMode(m,btn){

  mode =
    m;

  page =
    1;

  gallery.innerHTML =
    "";

  document
    .querySelectorAll("header button")
    .forEach(
      b =>
        b.classList.remove("active")
    );

  btn.classList.add("active");


  if(m === "fav"){

    loadButton.style.display =
      "none";

    showFavorites();

    return;

  }


  if(m === "blocked"){

    loadButton.style.display =
      "none";

    showBlocked();

    return;

  }


  loadButton.style.display =
    "block";

  loadMore();

}


/* =====================================
   加载 API
===================================== */

async function loadMore(){

  if(loading)
    return;


  if(
    mode === "fav" ||
    mode === "blocked"
  )
    return;


  loading =
    true;

  loadButton.disabled =
    true;

  status.textContent =
    "正在加载图片……";


  try{

    const params =
      new URLSearchParams();

    params.set(
      "tags",
      getTags()
    );

    params.set(
      "limit",
      LIMIT
    );

    params.set(
      "page",
      page
    );


    const response =
      await fetch(
        API +
        "?" +
        params.toString()
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const posts =
      await response.json();


    if(!Array.isArray(posts)){

      throw new Error(
        "API返回格式错误"
      );

    }


    let added =
      0;


    for(const post of posts){

      if(!post.file_url)
        continue;


      const id =
        String(post.id);


      /* 排除鸣人佐助 */

      if(isExcluded(post))
        continue;


      /* 已拉黑 */

      if(isBlocked(id))
        continue;


      /* SFW */

      if(
        mode === "sfw" &&
        !isSFW(post)
      )
        continue;


      /* NSFW */

      if(
        mode === "nsfw" &&
        isSFW(post)
      )
        continue;


      addCard(post);

      added++;

    }


    if(posts.length === 0){

      status.textContent =
        "没有更多图片了";

      loadButton.style.display =
        "none";

    }else{

      status.textContent =
        "本次加载 " +
        added +
        " 张 · 当前 " +
        gallery.children.length +
        " 张";

    }


    page++;


  }catch(error){

    console.error(error);

    status.textContent =
      "加载失败：" +
      error.message;

  }


  loading =
    false;

  loadButton.disabled =
    false;

}


/* =====================================
   普通图片卡片
===================================== */

function addCard(post){

  const id =
    String(post.id);


  const card =
    document.createElement("article");

  card.className =
    "card";


  const img =
    document.createElement("img");


  img.loading =
    "lazy";


  img.src =
    post.large_file_url ||
    post.preview_file_url ||
    post.file_url;


  img.alt =
    "Naruto fanart";


  img.onerror =
    function(){

      if(
        this.src !== post.file_url
      ){

        this.src =
          post.file_url;

      }

    };


  img.onclick =
    function(){

      openViewer(
        post.file_url
      );

    };


  const info =
    document.createElement("div");

  info.className =
    "info";


  info.textContent =
    "ID: " +
    id +
    " · " +
    (
      isSFW(post)
      ? "SFW"
      : "NSFW"
    );


  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  /* 收藏 */

  const fav =
    document.createElement("button");


  updateFavoriteButton(
    fav,
    id
  );


  fav.onclick =
    function(){

      toggleFavorite(post);

      updateFavoriteButton(
        fav,
        id
      );

    };


  /* 拉黑 */

  const block =
    document.createElement("button");

  block.textContent =
    "🚫 拉黑";


  block.onclick =
    function(){

      addBlocked(post);

      card.remove();

    };


  /* 原帖 */

  const source =
    document.createElement("button");

  source.textContent =
    "🔗 原帖";


  source.onclick =
    function(){

      window.open(
        "https://danbooru.donmai.us/posts/" +
        id,
        "_blank"
      );

    };


  actions.append(
    fav,
    block,
    source
  );


  info.appendChild(
    actions
  );


  card.append(
    img,
    info
  );


  gallery.appendChild(
    card
  );

}


/* =====================================
   收藏
===================================== */

function toggleFavorite(post){

  const id =
    String(post.id);


  const index =
    favorites.findIndex(
      x =>
        String(x.id) === id
    );


  if(index >= 0){

    favorites.splice(
      index,
      1
    );

  }else{

    /*
      关键：
      保存完整图片信息
    */

    favorites.push({

      id:id,

      image:
        post.file_url || "",

      preview:
        post.large_file_url ||
        post.preview_file_url ||
        post.file_url ||
        "",

      rating:
        post.rating ||
        "q"

    });

  }


  saveFavorites();

}


function updateFavoriteButton(
  button,
  id
){

  button.textContent =
    isFavorite(id)
    ? "💔 取消收藏"
    : "❤️ 收藏";

}


/* =====================================
   拉黑
===================================== */

function addBlocked(post){

  const id =
    String(post.id);


  if(isBlocked(id))
    return;


  blocked.push({

    id:id,

    image:
      post.file_url || "",

    preview:
      post.large_file_url ||
      post.preview_file_url ||
      post.file_url ||
      "",

    rating:
      post.rating ||
      "q"

  });


  saveBlocked();


  status.textContent =
    "已拉黑 ID " +
    id;

}


/* =====================================
   收藏页面
===================================== */

async function showFavorites(){

  gallery.innerHTML =
    "";


  if(favorites.length === 0){

    gallery.innerHTML =
      '<div class="empty">' +
      '❤️ 暂无收藏图片' +
      '</div>';

    status.textContent =
      "暂无收藏";

    return;

  }


  status.textContent =
    "正在读取收藏……";


  let repaired =
    false;


  /*
    先显示已经保存完整数据的收藏
  */

  for(const item of favorites){

    if(item.image){

      addStoredFavoriteCard(
        item
      );

    }

  }


  /*
    修复旧版本只有 ID 的收藏
  */

  for(const item of favorites){

    if(item.image)
      continue;


    try{

      const params =
        new URLSearchParams();

      params.set(
        "tags",
        "id:" + item.id
      );

      params.set(
        "limit",
        "1"
      );


      const response =
        await fetch(
          API +
          "?" +
          params.toString()
        );


      if(!response.ok)
        continue;


      const posts =
        await response.json();


      if(
        !Array.isArray(posts) ||
        !posts.length
      )
        continue;


      const post =
        posts[0];


      if(!post.file_url)
        continue;


      item.image =
        post.file_url;


      item.preview =
        post.large_file_url ||
        post.preview_file_url ||
        post.file_url;


      item.rating =
        post.rating ||
        "q";


      repaired =
        true;


      addStoredFavoriteCard(
        item
      );


    }catch(error){

      console.log(
        "修复收藏失败:",
        item.id
      );

    }

  }


  if(repaired){

    saveFavorites();

  }


  if(
    gallery.children.length === 0
  ){

    gallery.innerHTML =
      '<div class="empty">' +
      '收藏图片无法恢复。<br><br>' +
      '请重新点一次 ❤️ 收藏。' +
      '</div>';

  }


  status.textContent =
    "❤️ 收藏 " +
    favorites.length +
    " 张";

}


/* =====================================
   收藏卡片
===================================== */

function addStoredFavoriteCard(
  item
){

  if(!item.image)
    return;


  const id =
    String(item.id);


  const card =
    document.createElement("article");

  card.className =
    "card";


  const img =
    document.createElement("img");


  img.loading =
    "lazy";


  img.src =
    item.preview ||
    item.image;


  img.onerror =
    function(){

      if(
        this.src !== item.image
      ){

        this.src =
          item.image;

      }

    };


  img.onclick =
    function(){

      openViewer(
        item.image
      );

    };


  const info =
    document.createElement("div");

  info.className =
    "info";


  info.textContent =
    "ID: " +
    id +
    " · ❤️ 已收藏";


  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  const remove =
    document.createElement("button");

  remove.textContent =
    "💔 取消收藏";


  remove.onclick =
    function(){

      favorites =
        favorites.filter(
          x =>
            String(x.id) !== id
        );


      saveFavorites();

      card.remove();


      if(
        favorites.length === 0
      ){

        showFavorites();

      }

    };


  const source =
    document.createElement("button");

  source.textContent =
    "🔗 原帖";


  source.onclick =
    function(){

      window.open(
        "https://danbooru.donmai.us/posts/" +
        id,
        "_blank"
      );

    };


  actions.append(
    remove,
    source
  );


  info.appendChild(
    actions
  );


  card.append(
    img,
    info
  );


  gallery.appendChild(
    card
  );

}


/* =====================================
   拉黑页面
===================================== */

function showBlocked(){

  gallery.innerHTML =
    "";


  if(blocked.length === 0){

    gallery.innerHTML =
      '<div class="empty">' +
      '🚫 暂无拉黑图片' +
      '</div>';

    status.textContent =
      "暂无拉黑图片";

    return;

  }


  for(const item of blocked){

    if(!item.image)
      continue;


    addStoredBlockedCard(
      item
    );

  }


  status.textContent =
    "🚫 已拉黑 " +
    blocked.length +
    " 张";

}


/* =====================================
   拉黑卡片
===================================== */

function addStoredBlockedCard(
  item
){

  const id =
    String(item.id);


  const card =
    document.createElement("article");

  card.className =
    "card";


  const img =
    document.createElement("img");


  img.loading =
    "lazy";


  img.src =
    item.preview ||
    item.image;


  img.onerror =
    function(){

      if(
        this.src !== item.image
      ){

        this.src =
          item.image;

      }

    };


  img.onclick =
    function(){

      openViewer(
        item.image
      );

    };


  const info =
    document.createElement("div");

  info.className =
    "info";


  info.textContent =
    "ID: " +
    id +
    " · 🚫 已拉黑";


  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  const restore =
    document.createElement("button");

  restore.textContent =
    "↩️ 恢复";


  restore.onclick =
    function(){

      blocked =
        blocked.filter(
          x =>
            String(x.id) !== id
        );


      saveBlocked();

      card.remove();


      if(
        blocked.length === 0
      ){

        showBlocked();

      }

    };


  const source =
    document.createElement("button");

  source.textContent =
    "🔗 原帖";


  source.onclick =
    function(){

      window.open(
        "https://danbooru.donmai.us/posts/" +
        id,
        "_blank"
      );

    };


  actions.append(
    restore,
    source
  );


  info.appendChild(
    actions
  );


  card.append(
    img,
    info
  );


  gallery.appendChild(
    card
  );

}


/* =====================================
   搜索
===================================== */

search.addEventListener(
  "keydown",
  function(e){

    if(e.key !== "Enter")
      return;


    currentTag =
      search.value.trim() ||
      "haruno_sakura";


    page =
      1;

    mode =
      "all";

    gallery.innerHTML =
      "";

    loadButton.style.display =
      "block";

    loadMore();

  }
);


/* =====================================
   图片查看器
===================================== */

const viewer =
document.getElementById(
  "viewer"
);

const viewerImg =
document.getElementById(
  "viewerImg"
);

const close =
document.getElementById(
  "close"
);


let scale =
  1;

let posX =
  0;

let posY =
  0;

let lastTap =
  0;

let pinchStart =
  0;

let pinchScale =
  1;

let startX =
  0;

let startY =
  0;


function updateTransform(){

  viewerImg.style.transform =
    "translate(" +
    posX +
    "px," +
    posY +
    "px) scale(" +
    scale +
    ")";

}


function openViewer(url){

  if(!url)
    return;


  viewer.style.display =
    "flex";


  viewerImg.src =
    url;


  scale =
    1;

  posX =
    0;

  posY =
    0;

  updateTransform();

}


function closeViewer(){

  viewer.style.display =
    "none";

  viewerImg.src =
    "";

}


close.onclick =
  function(e){

    e.stopPropagation();

    closeViewer();

  };


/* 双击放大 */

viewerImg.addEventListener(
  "click",
  function(){

    const now =
      Date.now();


    if(
      now - lastTap < 300
    ){

      if(scale === 1){

        scale =
          2;

      }else{

        scale =
          1;

        posX =
          0;

        posY =
          0;

      }


      updateTransform();

    }


    lastTap =
      now;

  }
);


/* 双指缩放 */

viewer.addEventListener(
  "touchstart",
  function(e){

    if(
      e.touches.length === 2
    ){

      pinchStart =
        distance(
          e.touches[0],
          e.touches[1]
        );

      pinchScale =
        scale;

    }else if(
      e.touches.length === 1
    ){

      startX =
        e.touches[0].clientX -
        posX;

      startY =
        e.touches[0].clientY -
        posY;

    }

  },
  {
    passive:false
  }
);


viewer.addEventListener(
  "touchmove",
  function(e){

    e.preventDefault();


    if(
      e.touches.length === 2
    ){

      const d =
        distance(
          e.touches[0],
          e.touches[1]
        );


      scale =
        pinchScale *
        (d / pinchStart);


      scale =
        Math.max(
          1,
          Math.min(
            scale,
            5
          )
        );


      updateTransform();


    }else if(
      e.touches.length === 1 &&
      scale > 1
    ){

      posX =
        e.touches[0].clientX -
        startX;

      posY =
        e.touches[0].clientY -
        startY;

      updateTransform();

    }

  },
  {
    passive:false
  }
);


function distance(a,b){

  return Math.hypot(
    a.clientX -
    b.clientX,

    a.clientY -
    b.clientY
  );

}


/* 黑色背景关闭 */

viewer.addEventListener(
  "click",
  function(e){

    if(
      e.target === viewer
    ){

      closeViewer();

    }

  }
);


/* =====================================
   启动
===================================== */

loadMore();

</script>
