<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🍃 Naruto Gallery</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101010;
  color:#fff;
  font-family:Arial,"Microsoft YaHei",sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#181818;
  padding:12px;
  border-bottom:1px solid #333;
}

h1{
  margin:0 0 10px;
  font-size:22px;
}

input{
  width:100%;
  padding:11px;
  margin-bottom:8px;
  border:0;
  border-radius:8px;
  background:#292929;
  color:#fff;
  outline:none;
}

button{
  padding:9px 12px;
  margin:3px 2px;
  border:0;
  border-radius:8px;
  background:#303030;
  color:#fff;
}

button.active{
  background:#e67e22;
}

#status{
  margin-top:7px;
  color:#aaa;
  font-size:13px;
}

#gallery{
  display:grid;
  grid-template-columns:1fr;
  gap:9px;
  padding:9px;
}

.card{
  overflow:hidden;
  background:#1d1d1d;
  border-radius:9px;
}

.card img{
  display:block;
  width:100%;
  cursor:pointer;
}

.info{
  padding:9px;
  font-size:13px;
}

.actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.actions button{
  flex:1;
  margin:0;
}

.load{
  display:block;
  margin:15px auto 30px;
  background:#e67e22;
  font-size:16px;
}

.empty{
  padding:50px 10px;
  text-align:center;
  color:#888;
}

/* 全屏查看 */

#viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  touch-action:none;
}

#viewerImg{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  transform-origin:center;
  user-select:none;
  -webkit-user-drag:none;
}

#close{
  position:fixed;
  top:12px;
  right:12px;
  z-index:101;
  width:42px;
  height:42px;
  padding:0;
  border-radius:50%;
  background:#333;
  font-size:26px;
}

#hint{
  position:fixed;
  bottom:15px;
  left:0;
  right:0;
  text-align:center;
  color:#aaa;
  font-size:13px;
  pointer-events:none;
}
</style>
</head>

<body>

<header>

<h1>🍃 Naruto Gallery</h1>

<input
 id="search"
 placeholder="输入角色或标签，例如 sakura、hinata、mei_terumi">

<div>

<button class="active"
 onclick="character('sakura',this)">
小樱
</button>

<button onclick="character('hinata_hyuga',this)">
雏田
</button>

<button onclick="character('yamanaka_ino',this)">
井野
</button>

<button onclick="character('tsunade',this)">
纲手
</button>

<button onclick="character('tenten',this)">
天天
</button>

<button onclick="character('temari',this)">
手鞠
</button>

<button onclick="character('mei_terumi',this)">
照美冥
</button>

<button onclick="character('konan',this)">
小南
</button>

</div>

<div>

<button onclick="setMode('all',this)">
全部
</button>

<button onclick="setMode('sfw',this)">
SFW
</button>

<button onclick="setMode('nsfw',this)">
NSFW
</button>

<button onclick="setMode('fav',this)">
❤️ 收藏
</button>

<button onclick="setMode('blocked',this)">
🚫 已拉黑
</button>

</div>

<div id="status">
正在加载……
</div>

</header>

<main id="gallery"></main>

<button
 class="load"
 onclick="loadMore()">
加载更多
</button>

<div id="viewer">

<button id="close">
×
</button>

<img id="viewerImg">

<div id="hint">
双击放大 · 双指缩放 · 单指拖动
</div>

</div>

<script>

const API =
"https://danbooru.donmai.us/posts.json";

const LIMIT = 100;

let currentTag = "sakura";

let page = 1;

let mode = "all";

let loading = false;

let blocked =
JSON.parse(
localStorage.getItem("narutoBlocked") || "[]"
).map(String);

let favorites =
JSON.parse(
localStorage.getItem("narutoFavorites") || "[]"
).map(String);

const gallery =
document.getElementById("gallery");

const status =
document.getElementById("status");

const search =
document.getElementById("search");


function saveData(){

localStorage.setItem(
"narutoBlocked",
JSON.stringify(blocked)
);

localStorage.setItem(
"narutoFavorites",
JSON.stringify(favorites)
);

}


function character(tag,btn){

currentTag = tag;

page = 1;

mode = "all";

gallery.innerHTML = "";

document
.querySelectorAll("header button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

loadMore();

}


function setMode(m,btn){

mode = m;

page = 1;

gallery.innerHTML = "";

document
.querySelectorAll("header button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

if(m === "blocked"){

showBlocked();

return;

}

if(m === "fav"){

showFavorites();

return;

}

loadMore();

}


function getTags(){

const text =
search.value.trim();

if(text)
return text;

return currentTag;

}


function isSFW(post){

return post.rating === "s"
|| post.rating === "g";

}


function matchMode(post){

if(mode === "sfw")
return isSFW(post);

if(mode === "nsfw")
return !isSFW(post);

return true;

}


async function loadMore(){

if(loading)
return;

loading = true;

status.textContent =
"正在加载图片……";

try{

const tags = getTags();

const url =
API +
"?tags=" +
encodeURIComponent(tags) +
"&limit=" +
LIMIT +
"&page=" +
page;

const response =
await fetch(url);

if(!response.ok)
throw new Error(
"HTTP "+response.status
);

const posts =
await response.json();

if(!Array.isArray(posts))
throw new Error(
"API返回格式错误"
);

let added = 0;

for(const post of posts){

if(!post.file_url)
continue;

const id =
String(post.id);

if(blocked.includes(id))
continue;

if(!matchMode(post))
continue;

addCard(post);

added++;

}

if(posts.length === 0){

status.textContent =
"没有更多图片了";

}else{

status.textContent =
"已加载 " +
gallery.children.length +
" 张";

}

page++;

}catch(error){

console.error(error);

status.textContent =
"图片加载失败："+error.message;

}

loading = false;

}


function addCard(post){

const id =
String(post.id);

const card =
document.createElement("article");

card.className = "card";


const img =
document.createElement("img");

img.loading = "lazy";

img.src =
post.large_file_url ||
post.file_url ||
post.preview_file_url;

img.alt =
"Naruto fanart";

img.onclick = ()=>{
openViewer(post.file_url);
};


const info =
document.createElement("div");

info.className = "info";

info.textContent =
"ID: "+id+
" · "+
(isSFW(post)?"SFW":"NSFW");


const actions =
document.createElement("div");

actions.className = "actions";


const fav =
document.createElement("button");

updateFavoriteText(fav,id);

fav.onclick = ()=>{

toggleFavorite(id);

updateFavoriteText(fav,id);

};


const block =
document.createElement("button");

block.textContent =
"🚫 拉黑";

block.onclick = ()=>{

if(!blocked.includes(id)){

blocked.push(id);

saveData();

card.remove();

}

};


const source =
document.createElement("button");

source.textContent =
"🔗 原帖";

source.onclick = ()=>{

window.open(
"https://danbooru.donmai.us/posts/"+id,
"_blank"
);

};


actions.append(
fav,
block,
source
);

info.appendChild(actions);

card.append(
img,
info
);

gallery.appendChild(card);

}


function updateFavoriteText(btn,id){

btn.textContent =
favorites.includes(id)
? "💔 取消收藏"
: "❤️ 收藏";

}


function toggleFavorite(id){

if(favorites.includes(id)){

favorites =
favorites.filter(
x=>x!==id
);

}else{

favorites.push(id);

}

saveData();

}


function showBlocked(){

gallery.innerHTML = "";

if(blocked.length === 0){

gallery.innerHTML =
'<div class="empty">暂无拉黑图片</div>';

status.textContent =
"暂无拉黑图片";

return;

}

status.textContent =
"已拉黑 "+blocked.length+" 张";

}


function showFavorites(){

gallery.innerHTML = "";

if(favorites.length === 0){

gallery.innerHTML =
'<div class="empty">暂无收藏图片</div>';

status.textContent =
"暂无收藏";

return;

}

status.textContent =
"收藏了 "+favorites.length+" 张";

}


/* 搜索 */

search.addEventListener(
"keydown",
function(e){

if(e.key !== "Enter")
return;

currentTag =
search.value.trim() ||
"sakura";

page = 1;

mode = "all";

gallery.innerHTML = "";

loadMore();

}
);


/* =====================
   图片查看器
===================== */

const viewer =
document.getElementById("viewer");

const viewerImg =
document.getElementById("viewerImg");

const close =
document.getElementById("close");

let scale = 1;

let posX = 0;

let posY = 0;

let lastTap = 0;

let pinchStart = 0;

let pinchScale = 1;

let startX = 0;

let startY = 0;


function updateTransform(){

viewerImg.style.transform =
"translate("+
posX+
"px,"+
posY+
"px) scale("+
scale+
")";

}


function openViewer(url){

viewer.style.display = "flex";

viewerImg.src = url;

scale = 1;

posX = 0;

posY = 0;

updateTransform();

}


function closeViewer(){

viewer.style.display = "none";

viewerImg.src = "";

}


close.onclick = function(e){

e.stopPropagation();

closeViewer();

};


/* 双击 */

viewerImg.addEventListener(
"click",
function(){

const now =
Date.now();

if(now-lastTap < 300){

if(scale === 1){

scale = 2;

}else{

scale = 1;

posX = 0;

posY = 0;

}

updateTransform();

}

lastTap = now;

});


/* 双指 */

viewer.addEventListener(
"touchstart",
function(e){

if(e.touches.length === 2){

pinchStart =
distance(
e.touches[0],
e.touches[1]
);

pinchScale = scale;

}else if(e.touches.length === 1){

startX =
e.touches[0].clientX -
posX;

startY =
e.touches[0].clientY -
posY;

}

},
{passive:false}
);


viewer.addEventListener(
"touchmove",
function(e){

e.preventDefault();

if(e.touches.length === 2){

const current =
distance(
e.touches[0],
e.touches[1]
);

scale =
pinchScale *
(current / pinchStart);

scale =
Math.max(
1,
Math.min(scale,5)
);

updateTransform();

}

else if(
e.touches.length === 1 &&
scale > 1
){

posX =
e.touches[0].clientX -
startX;

posY =
e.touches[0].clientY -
startY;

updateTransform();

}

},
{passive:false}
);


function distance(a,b){

return Math.hypot(
a.clientX-b.clientX,
a.clientY-b.clientY
);

}


/* 点击背景关闭 */

viewer.addEventListener(
"click",
function(e){

if(e.target === viewer)
closeViewer();

});


/* 开始 */

loadMore();

</script>

</body>
</html>
